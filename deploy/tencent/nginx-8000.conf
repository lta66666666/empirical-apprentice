# 腾讯云轻量服务器 HTTPS 反向代理（端口 8000）。
# 证书由 acme.sh 通过 DuckDNS DNS-01 签发，renew-cert.sh 每日同步后 reload。
server {
    listen 8000 ssl;
    listen [::]:8000 ssl;
    server_name ea-demo.duckdns.org;

    ssl_certificate     /etc/nginx/certs/ea-demo.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/ea-demo.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 8m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
