services:
  joycode:
    build:
      context: .
      args:
        IMAGE_TAG: ${IMAGE_TAG:-latest}
    image: empirical-apprentice-joycode:${IMAGE_TAG:-latest}
    container_name: empirical-apprentice-joycode
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EA_DEPLOYMENT_APPROVED: "true"
      EA_DATA_DIR: /data/web
      EA_NODE_DATA: /data/executor
      # 对外只有 HTTPS 域名；同时允许按 IP 直连的评审入口发起 POST。
      PUBLIC_ORIGIN: https://ea-demo.duckdns.org:8000
      EA_ALLOWED_ORIGINS: https://106.52.65.254:8000
      EA_ALLOW_INSECURE_HTTP: "false"
      EA_TRUSTED_PROXY_ADDRESSES: "127.0.0.1"
      EA_CLIENT_IP_HEADER: x-real-ip
      # 以下限额均可在不重建镜像的情况下调整。
      EA_MAX_QUEUE: "10"
      EA_DAILY_LIMIT: "30"
      EA_JOB_TIMEOUT: "120"
      # 可选：填写后仅允许列表内的本机 Stata 助手版本（逗号分隔），留空表示不限制。
      # STATA_MCP_VERSIONS: "1.4.0"
      # 教学专用模式：Stata 只展示对应代码，不接收本机/云端执行。
      STATA_TEACHING_ONLY: "true"
    ports:
      - "127.0.0.1:18000:8080"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
