<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实证学徒 · 登录</title><link rel="stylesheet" href="/static/auth.css"><script defer src="/static/auth-view.js"></script></head><body><main class="auth-card"><h1 id="title">登录实证学徒</h1><p id="intro">使用你的个人账号继续学习。</p><form id="authForm"><label>用户名<input id="username" name="username" autocomplete="username" pattern="[A-Za-z0-9_]{3,32}" minlength="3" maxlength="32" required></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" minlength="12" required></label><p class="hint">用户名为3–32位字母、数字或下划线，不区分大小写。密码至少12个字符，最多72个UTF-8字节。</p><p id="registerNotice" hidden>本轮不提供密码找回，请妥善保存密码。账号持续保留；练习和文件在最后活动七天后到期。</p><p id="error" role="alert"></p><button type="submit" id="submit">登录</button></form><a id="switch" href="/register">没有账号？自行注册</a></main></body></html>
